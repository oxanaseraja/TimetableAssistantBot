# configuration.yaml — MVP Runtime Configuration
# Schema: see inline comments for validation rules
#
# IMPORTANT: Do not store secrets here. Use environment variables.
# Token should be set via TELEGRAM_TOKEN environment variable.

# =============================================================================
# CORE SETTINGS (platform-agnostic)
# =============================================================================

core:
  # Can use environment variables: ${VAR_NAME} or ${VAR_NAME:default_value}
  default_timezone: "${CORE_DEFAULT_TIMEZONE:null}"       # string|null|"UTC", IANA timezone ID, optional, default=null
  max_time_mentions: "${CORE_MAX_TIME_MENTIONS:3}"       # int, range=[1, 10], optional, default=3

output:
  # Can use environment variables: ${VAR_NAME} or ${VAR_NAME:default_value}
  max_timezones: "${OUTPUT_MAX_TIMEZONES:5}"             # int, range=[1, 10], optional, default=5
  ordering: "${OUTPUT_ORDERING:SOURCE_FIRST}"           # enum: "SOURCE_FIRST" | "OFFSET_ASC" | "ALPHABETICAL", optional, default="SOURCE_FIRST"

logging:
  level: "INFO"                # enum: DEBUG|INFO|WARNING|ERROR, optional, default="INFO"

# =============================================================================
# TELEGRAM ADAPTER SETTINGS
# =============================================================================

telegram:
  # REQUIRED fields (adapter will not start without these)
  # Can use environment variables: ${VAR_NAME} or ${VAR_NAME:default_value}
  token: "${TELEGRAM_TOKEN}"              # string, required, from environment
  chat_id: "${TELEGRAM_CHAT_ID}"          # string, required, from environment (or set directly)

  # OPTIONAL fields (have defaults)
  # Can use environment variables: ${VAR_NAME} or ${VAR_NAME:default_value}
  max_lines: "${TELEGRAM_MAX_LINES:5}"                 # int, range=[1, 10], optional, default=5
  retry_attempts: "${TELEGRAM_RETRY_ATTEMPTS:3}"      # int, range=[1, 10], optional, default=3
  persistence_path: "${TELEGRAM_PERSISTENCE_PATH:null}"  # string|null, optional, default=null

# =============================================================================
# DATA FILES
# =============================================================================

data:
  # Paths can use environment variables: ${VAR_NAME} or ${VAR_NAME:default_value}
  cities_path: "${DATA_CITIES_PATH:data/cities.json}"    # string, required, path to cities whitelist
  users_path: "${DATA_USERS_PATH:data/users.json}"       # string, required, path to user profiles

# =============================================================================
# VALIDATION RULES
# =============================================================================
#
# On startup, adapter validates:
# 1. telegram.token is non-empty (from env or direct value)
# 2. telegram.chat_id is non-empty
# 3. data.cities_path file exists and is valid JSON
# 4. data.users_path file exists and is valid JSON (or empty object {})
#
# If validation fails → adapter does not start, logs error.
# No partial startup. No fallback to defaults for required fields.
